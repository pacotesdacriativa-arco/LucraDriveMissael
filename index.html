<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucraDrive</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:20px 15px 50px;
}

/* CABEÇALHO */

.logo{
    text-align:center;
    margin:8px 0 20px;
}

.logo h1{
    font-size:32px;
    letter-spacing:-1px;
}

.logo h1 span{
    color:#28d66f;
}

.logo p{
    color:#8e8e8e;
    font-size:13px;
    margin-top:5px;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.card{
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:18px;
    padding:15px;
}

.card-label{
    font-size:12px;
    color:#999;
    margin-bottom:7px;
}

.card-value{
    font-size:21px;
    font-weight:bold;
}

.green{
    color:#28d66f;
}

.red{
    color:#ff4545;
}

.yellow{
    color:#ffd52e;
}

/* MES */

.month-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
}

.month-header h2{
    font-size:20px;
}

.month-buttons{
    display:flex;
    gap:7px;
}

.month-buttons button{
    width:36px;
    height:36px;
    border-radius:11px;
    border:1px solid #292929;
    background:#191919;
    color:#fff;
    font-size:18px;
}

/* TABELA */

.table-box{
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:18px;
    overflow:hidden;
}

.table-head{
    display:grid;
    grid-template-columns:45px 1fr 1fr 1fr 1fr;
    padding:11px 10px;
    background:#171717;
    color:#8d8d8d;
    font-size:10px;
    text-transform:uppercase;
}

.day-row{
    display:grid;
    grid-template-columns:45px 1fr 1fr 1fr 1fr;
    padding:13px 10px;
    border-top:1px solid #1d1d1d;
    align-items:center;
    cursor:pointer;
}

.day-row:hover{
    background:#151515;
}

.day-number{
    font-weight:bold;
}

.small-money{
    font-size:12px;
}

.km-value{
    color:#ffd52e;
    font-size:12px;
}

.empty-day{
    color:#555;
    font-size:12px;
}

/* BOTÃO */

.primary-btn{
    width:100%;
    border:none;
    background:#28d66f;
    color:#000;
    padding:14px;
    border-radius:15px;
    font-weight:bold;
    font-size:15px;
    margin-top:12px;
}

.secondary-btn{
    width:100%;
    border:1px solid #292929;
    background:#111;
    color:#fff;
    padding:13px;
    border-radius:14px;
    font-weight:bold;
    margin-top:10px;
}

/* TELA */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* DETALHES */

.back{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.back button{
    border:none;
    width:38px;
    height:38px;
    border-radius:12px;
    background:#171717;
    color:#fff;
    font-size:20px;
}

.back h2{
    font-size:21px;
}

.form-box{
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:20px;
    padding:17px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    font-size:12px;
    color:#aaa;
    margin-bottom:7px;
}

.field input{
    width:100%;
    background:#080808;
    border:1px solid #292929;
    border-radius:13px;
    padding:13px;
    color:#fff;
    font-size:16px;
    outline:none;
}

.field input:focus{
    border-color:#28d66f;
}

.field.green-field input:focus{
    border-color:#28d66f;
}

.field.red-field input:focus{
    border-color:#ff4545;
}

.field.yellow-field input:focus{
    border-color:#ffd52e;
}

/* LUCRO */

.profit-box{
    background:#07150c;
    border:1px solid #155c31;
    border-radius:18px;
    padding:18px;
    text-align:center;
    margin-top:10px;
}

.profit-box small{
    color:#8baf98;
}

.profit-box strong{
    display:block;
    color:#28d66f;
    font-size:31px;
    margin-top:6px;
}

/* HISTÓRICO */

.history-card{
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:18px;
    padding:16px;
    margin-bottom:10px;
}

.history-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.history-top h3{
    font-size:18px;
}

.history-profit{
    color:#28d66f;
    font-weight:bold;
}

.history-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.history-stat{
    background:#080808;
    border-radius:12px;
    padding:10px;
}

.history-stat small{
    display:block;
    color:#777;
    font-size:10px;
}

.history-stat strong{
    display:block;
    margin-top:4px;
}

.delete-history{
    border:none;
    background:#2a1111;
    color:#ff5555;
    border-radius:10px;
    padding:8px 10px;
    margin-top:12px;
}

/* COMPARATIVO */

.compare{
    margin-top:15px;
}

.compare h2{
    font-size:20px;
    margin-bottom:10px;
}

.compare-card{
    background:#101010;
    border:1px solid #1d1d1d;
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

.compare-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.bar{
    height:9px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    background:#28d66f;
    border-radius:20px;
}

/* RESPONSIVO */

@media(max-width:500px){

    .table-head,
    .day-row{
        grid-template-columns:38px 1fr 1fr 1fr 1fr;
    }

    .table-head{
        font-size:8px;
    }

    .small-money,
    .km-value{
        font-size:10px;
    }

    .logo h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HOME ================= -->

<div id="homePage" class="page active">

    <div class="logo">
        <h1><span>Lucra</span>Drive</h1>
        <p>Saiba quanto você realmente lucra dirigindo.</p>
    </div>

    <div class="cards">

        <div class="card">
            <div class="card-label">Faturamento bruto</div>
            <div class="card-value green" id="monthGross">
                R$ 0,00
            </div>
        </div>

        <div class="card">
            <div class="card-label">Lucro líquido</div>
            <div class="card-value green" id="monthProfit">
                R$ 0,00
            </div>
        </div>

        <div class="card">
            <div class="card-label">Total de gastos</div>
            <div class="card-value red" id="monthExpenses">
                R$ 0,00
            </div>
        </div>

        <div class="card">
            <div class="card-label">KM rodados</div>
            <div class="card-value yellow" id="monthKm">
                0 km
            </div>
        </div>

    </div>

    <div class="month-header">

        <h2 id="monthTitle">
            Setembro 2026
        </h2>

        <div class="month-buttons">

            <button onclick="changeMonth(-1)">
                ‹
            </button>

            <button onclick="changeMonth(1)">
                ›
            </button>

        </div>

    </div>

    <div class="table-box">

        <div class="table-head">
            <div>Dia</div>
            <div>Bruto</div>
            <div>Gastos</div>
            <div>KM</div>
            <div>Líquido</div>
        </div>

        <div id="daysList"></div>

    </div>

    <button class="primary-btn" onclick="openDay()">
        + Registrar dia
    </button>

    <button class="secondary-btn" onclick="openHistory()">
        📊 Histórico e comparação
    </button>

</div>


<!-- ================= DIA ================= -->

<div id="dayPage" class="page">

    <div class="back">

        <button onclick="goHome()">
            ‹
        </button>

        <h2 id="dayTitle">
            Registrar dia
        </h2>

    </div>

    <div class="form-box">

        <div class="field">
            <label>📅 Dia</label>

            <input
                id="dayNumber"
                type="number"
                min="1"
                max="31"
                placeholder="Ex: 9"
            >
        </div>


        <div class="field green-field">

            <label>🟢 Faturamento bruto</label>

            <input
                id="gross"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field">

            <label>🤝 Corridas particulares</label>

            <input
                id="privateRides"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field red-field">

            <label>⛽ Combustível</label>

            <input
                id="fuel"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field red-field">

            <label>🔧 Manutenção</label>

            <input
                id="maintenance"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field red-field">

            <label>🍔 Alimentação</label>

            <input
                id="food"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field red-field">

            <label>🔴 Outros gastos</label>

            <input
                id="other"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ 0,00"
                oninput="calculateDayProfit()"
            >

        </div>


        <div class="field yellow-field">

            <label>🟡 KM rodados</label>

            <input
                id="km"
                type="number"
                min="0"
                step="0.1"
                placeholder="Ex: 180"
            >

        </div>


        <div class="profit-box">

            <small>Lucro líquido do dia</small>

            <strong id="dayProfit">
                R$ 0,00
            </strong>

        </div>


        <button
            class="primary-btn"
            onclick="saveDay()"
        >
            💾 Salvar dia
        </button>


        <button
            class="secondary-btn"
            onclick="deleteDay()"
        >
            🗑️ Apagar este dia
        </button>

    </div>

</div>


<!-- ================= HISTÓRICO ================= -->

<div id="historyPage" class="page">

    <div class="back">

        <button onclick="goHome()">
            ‹
        </button>

        <h2>📊 Histórico</h2>

    </div>

    <div id="historyList"></div>

    <div class="compare">

        <h2>📈 Comparação</h2>

        <div id="comparison"></div>

    </div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const STORAGE_KEY = "LucraDrive";

const monthNames = [
    "Janeiro",
    "Fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
    "Julho",
    "Agosto",
    "Setembro",
    "Outubro",
    "Novembro",
    "Dezembro"
];

let database = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
);

let currentDate = new Date();

let editingDay = null;


/* =====================================================
   SALVAR
===================================================== */

function saveDatabase(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

}


/* =====================================================
   CHAVE DO MÊS
===================================================== */

function monthKey(date){

    return date.getFullYear() + "-" +
        String(date.getMonth()+1).padStart(2,"0");

}


/* =====================================================
   CRIAR MÊS
===================================================== */

function getCurrentMonth(){

    const key = monthKey(currentDate);

    if(!database[key]){

        database[key] = {
            year:currentDate.getFullYear(),
            month:currentDate.getMonth(),
            days:{}
        };

        saveDatabase();

    }

    return database[key];

}


/* =====================================================
   QUANTIDADE DE DIAS
===================================================== */

function daysInMonth(){

    return new Date(
        currentDate.getFullYear(),
        currentDate.getMonth()+1,
        0
    ).getDate();

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function money(value){

    return Number(value || 0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   TOTAIS
===================================================== */

function getTotals(month){

    let gross = 0;
    let privateRides = 0;
    let fuel = 0;
    let maintenance = 0;
    let food = 0;
    let other = 0;
    let km = 0;

    Object.values(month.days).forEach(day=>{

        gross += Number(day.gross || 0);

        privateRides += Number(
            day.privateRides || 0
        );

        fuel += Number(day.fuel || 0);

        maintenance += Number(
            day.maintenance || 0
        );

        food += Number(day.food || 0);

        other += Number(day.other || 0);

        km += Number(day.km || 0);

    });

    /*
       O faturamento bruto informado pode ser
       o valor total recebido pelas plataformas.

       Corridas particulares entram separadamente
       e também entram no faturamento total.
    */

    const totalGross =
        gross + privateRides;

    const expenses =
        fuel +
        maintenance +
        food +
        other;

    const profit =
        totalGross - expenses;

    return {
        gross:totalGross,
        platformGross:gross,
        privateRides,
        fuel,
        maintenance,
        food,
        other,
        expenses,
        km,
        profit
    };

}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

    const month = getCurrentMonth();

    const totals = getTotals(month);

    document.getElementById("monthTitle")
        .innerText =
        monthNames[currentDate.getMonth()]
        + " "
        + currentDate.getFullYear();

    document.getElementById("monthGross")
        .innerText =
        money(totals.gross);

    document.getElementById("monthProfit")
        .innerText =
        money(totals.profit);

    document.getElementById("monthExpenses")
        .innerText =
        money(totals.expenses);

    document.getElementById("monthKm")
        .innerText =
        Number(totals.km).toLocaleString("pt-BR")
        + " km";

    renderDays();

}


/* =====================================================
   DIAS
===================================================== */

function renderDays(){

    const month = getCurrentMonth();

    const list =
        document.getElementById("daysList");

    list.innerHTML = "";

    const totalDays = daysInMonth();

    for(let day=1; day<=totalDays; day++){

        const item = month.days[day];

        let gross = 0;
        let expenses = 0;
        let km = 0;
        let profit = 0;

        if(item){

            gross =
                Number(item.gross || 0) +
                Number(item.privateRides || 0);

            expenses =
                Number(item.fuel || 0) +
                Number(item.maintenance || 0) +
                Number(item.food || 0) +
                Number(item.other || 0);

            km =
                Number(item.km || 0);

            profit =
                gross - expenses;

        }

        const row =
            document.createElement("div");

        row.className="day-row";

        row.onclick=()=>{
            openDay(day);
        };

        row.innerHTML=`

            <div class="day-number">
                ${day}
            </div>

            <div class="small-money green">
                ${
                    item
                    ? money(gross)
                    : "—"
                }
            </div>

            <div class="small-money red">
                ${
                    item
                    ? money(expenses)
                    : "—"
                }
            </div>

            <div class="km-value">
                ${
                    item
                    ? km + " km"
                    : "—"
                }
            </div>

            <div class="small-money green">
                ${
                    item
                    ? money(profit)
                    : "—"
                }
            </div>

        `;

        list.appendChild(row);

    }

}


/* =====================================================
   MUDAR MÊS
===================================================== */

function changeMonth(direction){

    currentDate.setMonth(
        currentDate.getMonth() + direction
    );

    getCurrentMonth();

    renderHome();

}


/* =====================================================
   ABRIR DIA
===================================================== */

function openDay(day=null){

    editingDay = day;

    const month = getCurrentMonth();

    if(day && month.days[day]){

        const item=month.days[day];

        document.getElementById("dayNumber").value=day;

        document.getElementById("gross").value =
            item.gross || "";

        document.getElementById("privateRides").value =
            item.privateRides || "";

        document.getElementById("fuel").value =
            item.fuel || "";

        document.getElementById("maintenance").value =
            item.maintenance || "";

        document.getElementById("food").value =
            item.food || "";

        document.getElementById("other").value =
            item.other || "";

        document.getElementById("km").value =
            item.km || "";

        document.getElementById("dayTitle")
            .innerText =
            "Editar dia " + day;

    }else{

        clearForm();

        document.getElementById("dayTitle")
            .innerText =
            "Registrar dia";

    }

    calculateDayProfit();

    showPage("dayPage");

}


/* =====================================================
   LIMPAR
===================================================== */

function clearForm(){

    [
        "dayNumber",
        "gross",
        "privateRides",
        "fuel",
        "maintenance",
        "food",
        "other",
        "km"
    ].forEach(id=>{
        document.getElementById(id).value="";
    });

    document.getElementById("dayProfit")
        .innerText =
        "R$ 0,00";

}


/* =====================================================
   CALCULAR LUCRO
===================================================== */

function calculateDayProfit(){

    const gross =
        Number(
            document.getElementById("gross").value
        ) || 0;

    const privateRides =
        Number(
            document.getElementById("privateRides").value
        ) || 0;

    const fuel =
        Number(
            document.getElementById("fuel").value
        ) || 0;

    const maintenance =
        Number(
            document.getElementById("maintenance").value
        ) || 0;

    const food =
        Number(
            document.getElementById("food").value
        ) || 0;

    const other =
        Number(
            document.getElementById("other").value
        ) || 0;

    const totalGross =
        gross + privateRides;

    const expenses =
        fuel +
        maintenance +
        food +
        other;

    const profit =
        totalGross - expenses;

    document.getElementById("dayProfit")
        .innerText =
        money(profit);

}


/* =====================================================
   SALVAR DIA
===================================================== */

function saveDay(){

    const day =
        Number(
            document.getElementById("dayNumber").value
        );

    const maxDays = daysInMonth();

    if(!day || day<1 || day>maxDays){

        alert(
            "Digite um dia válido entre 1 e "
            + maxDays
            + "."
        );

        return;

    }

    const month = getCurrentMonth();

    month.days[day]={

        gross:
            Number(
                document.getElementById("gross").value
            ) || 0,

        privateRides:
            Number(
                document.getElementById("privateRides").value
            ) || 0,

        fuel:
            Number(
                document.getElementById("fuel").value
            ) || 0,

        maintenance:
            Number(
                document.getElementById("maintenance").value
            ) || 0,

        food:
            Number(
                document.getElementById("food").value
            ) || 0,

        other:
            Number(
                document.getElementById("other").value
            ) || 0,

        km:
            Number(
                document.getElementById("km").value
            ) || 0

    };

    saveDatabase();

    renderHome();

    showPage("homePage");

}


/* =====================================================
   APAGAR DIA
===================================================== */

function deleteDay(){

    const day =
        Number(
            document.getElementById("dayNumber").value
        );

    if(!day)
        return;

    const month = getCurrentMonth();

    if(!month.days[day])
        return;

    if(!confirm(
        "Apagar os registros do dia "
        + day
        + "?"
    )){
        return;
    }

    delete month.days[day];

    saveDatabase();

    renderHome();

    showPage("homePage");

}


/* =====================================================
   HISTÓRICO
===================================================== */

function openHistory(){

    renderHistory();

    showPage("historyPage");

}


function renderHistory(){

    const box =
        document.getElementById("historyList");

    box.innerHTML="";

    const keys =
        Object.keys(database)
        .sort()
        .reverse();

    if(!keys.length){

        box.innerHTML=`
            <div class="history-card">
                Nenhum mês registrado ainda.
            </div>
        `;

        return;

    }

    keys.forEach(key=>{

        const month =
            database[key];

        const totals =
            getTotals(month);

        const card =
            document.createElement("div");

        card.className="history-card";

        card.innerHTML=`

            <div class="history-top">

                <h3>
                    ${monthNames[month.month]}
                    ${month.year}
                </h3>

                <div class="history-profit">
                    ${money(totals.profit)}
                </div>

            </div>

            <div class="history-stats">

                <div class="history-stat">

                    <small>Faturamento bruto</small>

                    <strong class="green">
                        ${money(totals.gross)}
                    </strong>

                </div>

                <div class="history-stat">

                    <small>Total de gastos</small>

                    <strong class="red">
                        ${money(totals.expenses)}
                    </strong>

                </div>

                <div class="history-stat">

                    <small>KM rodados</small>

                    <strong class="yellow">
                        ${totals.km.toLocaleString("pt-BR")} km
                    </strong>

                </div>

                <div class="history-stat">

                    <small>Corridas particulares</small>

                    <strong class="green">
                        ${money(totals.privateRides)}
                    </strong>

                </div>

            </div>

            <button
                class="delete-history"
                onclick="deleteMonth('${key}')"
            >
                🗑️ Apagar mês
            </button>

        `;

        box.appendChild(card);

    });

    renderComparison();

}


/* =====================================================
   COMPARAÇÃO
===================================================== */

function renderComparison(){

    const box =
        document.getElementById("comparison");

    box.innerHTML="";

    const keys =
        Object.keys(database)
        .sort()
        .reverse();

    if(!keys.length)
        return;

    let maxProfit=0;

    keys.forEach(key=>{

        const totals =
            getTotals(database[key]);

        if(totals.profit>maxProfit)
            maxProfit=totals.profit;

    });

    keys.forEach(key=>{

        const month =
            database[key];

        const totals =
            getTotals(month);

        let percentage=0;

        if(maxProfit>0){

            percentage =
                (totals.profit / maxProfit) * 100;

        }

        const card =
            document.createElement("div");

        card.className="compare-card";

        card.innerHTML=`

            <div class="compare-title">

                <strong>
                    ${monthNames[month.month]}
                    ${month.year}
                </strong>

                <strong class="green">
                    ${money(totals.profit)}
                </strong>

            </div>

            <div class="bar">

                <div
                    class="bar-fill"
                    style="width:${Math.max(0,percentage)}%"
                ></div>

            </div>

        `;

        box.appendChild(card);

    });

}


/* =====================================================
   APAGAR MÊS
===================================================== */

function deleteMonth(key){

    if(!confirm(
        "Apagar todo o histórico deste mês?"
    )){
        return;
    }

    delete database[key];

    saveDatabase();

    renderHistory();

    renderHome();

}


/* =====================================================
   TROCAR TELA
===================================================== */

function showPage(id){

    document.querySelectorAll(".page")
    .forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id)
        .classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function goHome(){

    renderHome();

    showPage("homePage");

}


/* =====================================================
   INICIAR
===================================================== */

getCurrentMonth();

renderHome();

</script>
